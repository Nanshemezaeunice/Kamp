[build]
  # Run from the frontend directory and build with the project's script
  base = "frontend"
  command = "npm run build"
  publish = "dist"
  environment = { VITE_API_BASE = "https://kamp-7waq.onrender.com" }

[functions]
  # Optional: where Netlify Functions live in this repo
  directory = "frontend/netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "https://kamp-7waq.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
